{% extends 'base.html' %}
{% block title %}{{ 'Edit' if group else 'New' }} Group — vCenter Manager{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('groups.index') }}" class="btn btn-sm btn-outline-secondary me-3">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h4 class="fw-bold mb-0">
                <i class="bi bi-people-fill me-2 text-primary"></i>
                {{ 'Edit Group' if group else 'New Group' }}
            </h4>
        </div>
        <div class="card border-secondary">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Group Name <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control bg-dark border-secondary text-white"
                               value="{{ group.name if group else '' }}"
                               placeholder="e.g. Linux Admins, Web Team, Helpdesk" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea name="description" class="form-control bg-dark border-secondary text-white" rows="3"
                                  placeholder="Optional — describe who this group is for or what access it grants">{{ group.description if group else '' }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-2"></i>{{ 'Save Changes' if group else 'Create Group' }}
                        </button>
                        <a href="{{ url_for('groups.index') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
