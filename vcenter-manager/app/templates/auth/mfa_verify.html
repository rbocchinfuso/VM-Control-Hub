<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication — Virtual Infra Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        body { background: #0d1117; }
        .mfa-card { max-width: 420px; }
        .code-input {
            font-size: 2rem;
            letter-spacing: 0.4rem;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
<div class="mfa-card w-100 px-3">
    <div class="text-center mb-4">
        <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3rem;"></i>
        <h2 class="fw-bold mt-2 text-white">Two-Factor Authentication</h2>
        <p class="text-muted">Enter the 6-digit code from your authenticator app</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    {% endif %}
    {% endwith %}

    <div class="card border-secondary">
        <div class="card-body p-4">
            <div class="text-center text-muted small mb-3">
                Signing in as <strong class="text-white">{{ username }}</strong>
            </div>
            <form method="POST" action="{{ url_for('auth.mfa_verify') }}" autocomplete="off">
                <div class="mb-4">
                    <input type="text" name="code" class="form-control bg-dark border-secondary text-white code-input"
                           placeholder="000000"
                           maxlength="6"
                           inputmode="numeric"
                           pattern="[0-9]{6}"
                           autocomplete="one-time-code"
                           autofocus required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-semibold">
                    <i class="bi bi-shield-check me-2"></i>Verify
                </button>
            </form>
        </div>
    </div>

    <div class="text-center mt-3">
        <a href="{{ url_for('auth.login') }}" class="text-muted small">
            <i class="bi bi-arrow-left me-1"></i>Back to login
        </a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Auto-submit when 6 digits are entered
    document.querySelector('input[name="code"]').addEventListener('input', function() {
        if (this.value.replace(/\D/g, '').length === 6) {
            this.value = this.value.replace(/\D/g, '');
            this.closest('form').submit();
        }
    });
</script>
</body>
</html>
