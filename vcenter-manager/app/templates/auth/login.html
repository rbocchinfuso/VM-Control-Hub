<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Infrastructure Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        body { background: #0d1117; }
        .login-card { max-width: 420px; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
<div class="login-card w-100 px-3">
    <div class="text-center mb-4">
        <i class="bi bi-hdd-network-fill text-primary" style="font-size: 3rem;"></i>
        <h2 class="fw-bold mt-2 text-white">Infrastructure Manager</h2>
        <p class="text-muted">PSCP CSS Infrastructure Control Portal</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    {% endif %}
    {% endwith %}

    <div class="card border-secondary">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">USERNAME</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" name="username" class="form-control bg-dark border-secondary text-white" placeholder="Enter username" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">PASSWORD</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" name="password" class="form-control bg-dark border-secondary text-white" placeholder="Enter password" required>
                    </div>
                </div>
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label text-muted" for="remember">Remember me</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
